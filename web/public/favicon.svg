<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A road block's stripes, ochre and near-black, rising to the right at 60° (CSS -60deg), under a white #. -->
  <defs>
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-60)">
      <rect width="8" height="4" fill="#c39144"/>
      <rect y="4" width="8" height="4" fill="#111113"/>
    </pattern>
  </defs>
  <style>
    .hash { stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; fill: none }
  </style>
  <rect x="2" y="2" width="28" height="28" rx="7" fill="url(#stripes)"/>
  <path class="hash" d="M12 6v20M20 6v20M6 12h20M6 20h20"/>
</svg>
